<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="<!--CSRF-->">
<title>Trips — Scout</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  body{margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
    box-sizing:border-box; background:#002b36; color:#839496;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  main{max-width:340px; text-align:center}
  h1{margin:0 0 6px; color:#eee8d5; font-size:19px; line-height:1.3; text-wrap:balance}
  p{margin:0; font-size:14px}
  a{color:#268bd2}
  /* A pulse on the mark while the one request is in flight, and nothing
     else: the page is on screen for well under a second when it works. */
  .mark{display:block; margin:0 auto 14px; color:#2aa198}
  main[aria-busy="true"] .mark{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){main[aria-busy="true"] .mark{animation:none}}
</style>
<script type="module" src="/tg.js"></script>
</head>
<body>
<main id="launch" aria-busy="true" aria-live="polite">
  <svg class="mark" viewBox="0 0 72 72" width="44" height="44" aria-hidden="true">
    <g fill="none" stroke="currentColor">
      <circle cx="23.5" cy="36" r="11.5" stroke-width="3.2"/>
      <circle cx="48.5" cy="36" r="11.5" stroke-width="3.2"/>
      <circle cx="23.5" cy="36" r="4" stroke-width="2.6"/>
      <circle cx="48.5" cy="36" r="4" stroke-width="2.6"/>
    </g>
    <rect x="34" y="33.4" width="4" height="5.2" fill="currentColor"/>
  </svg>
  <h1 id="launch-title">Opening your trips</h1>
  <p id="launch-copy">Signing you in with Telegram.</p>
</main>
</body>
</html>
