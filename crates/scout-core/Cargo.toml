[package]
name = "scout-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Everything that answers a question, with no idea who asked"

[dependencies]
scout-api = { path = "../scout-api" }
rig = "0.40"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
duckdb = { version = "1", features = ["bundled"] }
dashmap = "6"
# 0.13: rustls by default, which is what rig's copy already uses, so the
# binary carries one TLS stack and the image no OpenSSL. `query` and `form`
# became features in 0.13.
reqwest = { version = "0.13", features = ["json", "query", "form"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
futures = "0.3"
base64 = "0.22"
sha2 = "0.11"
tracing = "0.1"
rand = "0.10"
unicode-normalization = "0.1.25"

[dev-dependencies]
wiremock = "0.6"
rig = { version = "0.40", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
