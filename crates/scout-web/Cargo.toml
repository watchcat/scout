[package]
name = "scout-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scout's public face"

[dependencies]
scout-core = { path = "../scout-core" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
anyhow = "1"
tracing = "0.1"
axum = "0.8.9"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = "0.1.19"
scout-api = { version = "0.1.0", path = "../scout-api" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
