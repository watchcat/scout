<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="<!--CSRF-->">
<title>Chat — Scout</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{--base03:#002b36; --base02:#073642; --base01:#586e75; --base00:#657b83;
    --base0:#839496; --base1:#93a1a1; --base2:#eee8d5; --blue:#268bd2;
    --red:#dc322f; --green:#859900}
  *{box-sizing:border-box}
  body{margin:0; background:var(--base03); color:var(--base0);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:36px 0 20px; display:flex; align-items:center; gap:14px}
  .mark{display:flex; align-items:center; gap:12px; color:var(--cyan,#2aa198)}
  .mark .logo{width:36px; height:36px; flex:none}
  .mark .word{font-size:19px; font-weight:700; color:var(--base2)}
  .chat{padding-bottom:40px}
  .turns{list-style:none; margin:0 0 20px; padding:0; display:flex;
    flex-direction:column; gap:14px}
  .turns li{max-width:80%; padding:12px 16px; border-radius:8px; font-size:15px;
    white-space:pre-wrap}
  .turns li.you{align-self:flex-end; background:var(--blue); color:var(--base03)}
  .turns li.scout{align-self:flex-start; background:var(--base02); color:var(--base1)}
  .status{font-size:13.5px; color:var(--base01); margin:0 0 14px}
  .notice{font-size:13.5px; color:var(--red); margin:0 0 14px}
  .ask{display:flex; gap:10px; align-items:flex-end}
  textarea{flex:1; resize:vertical; padding:11px 12px; border-radius:5px;
    border:1px solid var(--base01); background:var(--base02); color:var(--base2);
    font:inherit}
  button{background:var(--blue); color:var(--base03); font:inherit; font-weight:650;
    padding:11px 22px; border-radius:5px; border:0; cursor:pointer}
  button:hover{background:#3196d8}
  button.quiet{background:transparent; color:var(--base01); border:1px solid var(--base01);
    padding:8px 16px; font-weight:600; font-size:13.5px}
  button.quiet:hover{background:transparent; color:var(--base1)}
  .reset{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="mark" href="/">
    <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
      <g fill="none" stroke="currentColor">
        <circle cx="23.5" cy="36" r="11.5" stroke-width="3.2"/>
        <circle cx="48.5" cy="36" r="11.5" stroke-width="3.2"/>
        <circle cx="23.5" cy="36" r="4" stroke-width="2.6"/>
        <circle cx="48.5" cy="36" r="4" stroke-width="2.6"/>
      </g>
      <rect x="34" y="33.4" width="4" height="5.2" fill="currentColor"/>
    </svg>
    <span class="word">Scout</span>
  </a>
</header>
<main class="chat">
  <ol id="turns" class="turns"></ol>
  <p id="status" class="status" hidden></p>
  <p id="notice" class="notice" hidden></p>
  <form id="ask" class="ask">
    <textarea id="text" name="text" rows="2"
              placeholder="Ask Scout something" required></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
  <form id="reset" class="reset">
    <button type="submit" class="quiet">Start a new thread</button>
  </form>
</main>
</div>
<script type="module" src="/chat.js"></script>
</body>
</html>
