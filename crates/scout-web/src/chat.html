<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="<!--CSRF-->">
<title>Chat — Scout</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* Without this the scrollbars are drawn light-on-light, which the capped
     status box made obvious: a white bar down a dark page. Also fixes the
     composer's own scrollbar and any native control on the page. */
  :root{color-scheme:dark}
  :root{--base03:#002b36; --base02:#073642; --base01:#586e75; --base00:#657b83;
    --base0:#839496; --base1:#93a1a1; --base2:#eee8d5; --blue:#268bd2;
    --cyan:#2aa198; --red:#dc322f; --green:#859900; --yellow:#b58900;
    --line:#0d4a5a; --panel:#062f3a}
  *{box-sizing:border-box}
  body{margin:0; background:var(--base03); color:var(--base0);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* dvh, not vh: on mobile `100vh` excludes the browser's own chrome, so
       a pinned bottom row lands underneath the URL bar — the exact failure
       this layout exists to remove. */
    height:100dvh; display:flex; flex-direction:column}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px; width:100%;
    flex:1; display:flex; flex-direction:column; min-height:0}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:24px 0 14px; display:flex; align-items:center; gap:14px;
    flex:none}
  .mark{display:flex; align-items:center; gap:12px; color:var(--cyan,#2aa198)}
  .mark .logo{width:32px; height:32px; flex:none}
  .mark .word{font-size:18px; font-weight:700; color:var(--base2)}
  /* `min-height:0` is load-bearing: a flex child will not scroll unless it
     is allowed to be shorter than its content. Without it this grows, the
     body grows with it, and the composer slides off the bottom exactly as
     it did before. */
  .turns{list-style:none; margin:0; padding:4px 0 16px; flex:1; min-height:0;
    overflow-y:auto; display:flex; flex-direction:column; gap:12px}
  /* `overflow-wrap:anywhere` is load-bearing, and `break-word` is not
     enough. `white-space:pre-wrap` only wraps at whitespace, and a
     percent-encoded url is one 200-character token with none in it — so an
     openrice link ran straight out of the bubble, gave `.turns` a
     horizontal scrollbar (a `visible` axis beside an `auto` one computes to
     `auto`), and pushed the body wide enough to shift the composer out of
     line with the thread. `anywhere` also shrinks the intrinsic min-content
     width, which `break-word` leaves alone — and that width is what was
     forcing the blowout. `min-width:0` for the same reason one axis up: a
     flex item refuses to shrink below its content without it. */
  .turns li{max-width:82%; min-width:0; padding:12px 16px; border-radius:14px;
    font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6}
  .turns li.you{align-self:flex-end; background:#1c4f66; color:var(--base2)}
  .turns li.scout{align-self:flex-start; background:var(--base02); color:var(--base1)}
  /* The narration the model writes between tool calls, and it can run to
     several thousand words. With `flex:none` and no ceiling it took the
     whole column: the transcript collapsed to nothing and the answer was
     pushed off screen entirely. A quarter of the viewport, then scroll.
     `dvh` for the same reason `body` uses it — `vh` is wrong under the
     mobile URL bar, and this box sits directly above the composer. */
  .status{font-size:13.5px; color:var(--base01); margin:0 0 10px; flex:none;
    max-height:25dvh; overflow-y:auto}
  /* Reasoning scrolled past dissolves at the cut instead of being sliced
     mid-word. Applied only while there is something above to dissolve:
     on a status short enough to fit, this would fade the one line it has.
     The mask is fixed to the box, not the content, so the soft edge stays
     at the top of the visible area as the text scrolls under it. */
  .status.long{-webkit-mask-image:linear-gradient(to bottom, transparent, #000 30px);
    mask-image:linear-gradient(to bottom, transparent, #000 30px)}
  /* One treatment for every box that scrolls: the transcript, the
     narration, the sidebar's list of threads, and the composer once it has
     grown past its cap.
     `color-scheme` above only swaps the browser's default light bar for
     its default grey one — this puts it in the page's own palette.
     `#0d4a5a` is the line the composer is already drawn with, so the
     thumb reads as the same structural colour rather than a new one.
     Track transparent: on a page this dark a track is just a seam. */
  .turns,.status,.side,.ask textarea{scrollbar-width:thin;
    scrollbar-color:#0d4a5a transparent}
  .notice{font-size:13.5px; color:var(--red); margin:0 0 10px; flex:none}
  .compose-target{font-size:12.5px; color:var(--base01); margin:0 0 6px; flex:none}
  .ask{flex:none; display:flex; align-items:flex-end; gap:8px;
    margin:0 0 20px; padding:8px 8px 8px 16px;
    background:var(--base02); border:1px solid #0d4a5a; border-radius:16px;
    box-shadow:0 8px 28px rgba(0,0,0,.30)}
  .ask textarea{flex:1; border:0; background:transparent; color:var(--base2);
    font:inherit; padding:9px 0; resize:none; overflow-y:auto; max-height:200px}
  .ask textarea:focus{outline:none}
  .ask textarea::placeholder{color:var(--base01)}
  #send{flex:none; width:38px; height:38px; display:flex; align-items:center;
    justify-content:center; background:var(--blue); color:var(--base03);
    border:0; border-radius:11px; cursor:pointer}
  #send:hover{background:#3196d8}
  .controls{display:flex; align-items:center; gap:8px}
  /* One control vocabulary: the sidebar's New thread and the header's
     mirror toggle are drawn the same. */
  .reset button,#mirror{background:transparent; color:var(--base01);
    border:1px solid var(--base01); border-radius:8px; font:inherit;
    font-size:13px; font-weight:600; padding:6px 12px; cursor:pointer}
  .reset button:hover,#mirror:hover{color:var(--base1)}
  #mirror{display:flex; align-items:center; padding:6px 10px}
  /* On, and visibly so: the reader has to be able to tell at a glance
     whether what they are typing is also going to their phone. */
  #mirror[aria-pressed="true"]{color:var(--blue); border-color:var(--blue)}
  /* Two columns above 720px, one below. `.wrap` was capped at 720px for
     a single column of text; with a sidebar beside it, it may be wider. */
  /* 260px, not 240: a thread's name is now the row's primary text at
     14.5px over two lines, and twenty more pixels is most of a word on
     each of them. `.wrap` grows by the same amount so the transcript
     column is exactly as wide as it was. */
  .wrap{max-width:1080px}
  .columns{flex:1; min-height:0; display:grid; grid-template-columns:260px 1fr; gap:24px}
  /* `min-height:0` for the same reason `.turns` has it: a grid child will
     not scroll unless it is allowed to be shorter than its content.
     `flex:1` is for the phone, where `.columns` is a flex column and this
     would otherwise be content-height — which unpins the composer from the
     bottom of the screen. A grid item ignores it, so it costs nothing here. */
  .main{display:flex; flex-direction:column; min-height:0; flex:1}
  /* The header gained a third child (the menu button, hidden on desktop),
     and `space-between` would have floated the logo into the middle of the
     row on a phone. An auto margin here pins the logo beside the menu and
     pushes the controls to the far end, which is why the header no longer
     asks for `space-between` at all. */
  .mark{margin-right:auto}
  .view-tabs{display:flex; padding:3px; gap:2px; border:1px solid var(--line);
    background:rgba(7,54,66,.68); border-radius:10px}
  .view-tabs button{border:0; border-radius:7px; padding:6px 12px; background:transparent;
    color:var(--base0); font:inherit; font-size:13px; font-weight:650; cursor:pointer}
  .view-tabs button:hover{color:var(--base2)}
  .view-tabs button[aria-pressed="true"]{background:#124659; color:var(--base2);
    box-shadow:0 1px 6px rgba(0,0,0,.22)}
  .view-tabs button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .tab-count{display:inline-flex; min-width:18px; height:18px; margin-left:5px; padding:0 5px;
    align-items:center; justify-content:center; border-radius:9px; background:var(--base03);
    color:var(--base0); font-size:11px; line-height:1}
  [hidden]{display:none!important}
  .side{min-height:0; overflow-y:auto; padding:4px 12px 16px 0; border-right:1px solid #0d4a5a}
  .side .reset{margin:0 0 10px}
  .side .reset button{width:100%}
  .threads{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
  /* `min-width:0` again: without it a long title refuses to shrink and the
     row pushes the whole sidebar wider than its track. */
  .threads li{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 10px;
    border-radius:10px; font-size:14px; color:var(--base0); cursor:pointer; min-width:0}
  .threads li:hover{background:var(--base02)}
  /* The current row is the one whose tools are permanently on screen, so
     it is the one where four 28px targets and a name were competing for a
     260px column — and the name lost, down to "Haribo Ho…". The wrap the
     rule above already sets lets the tools drop to a line of their own
     beneath the title (see `.tools` below), which is the only way both can
     be full size. */
  .threads li.current{background:var(--base02); color:var(--base2)}
  /* The title is a real `<button>`, so it is reachable by keyboard for
     free — and so it needs the browser's button chrome stripped back to
     the row's own type before anything below can style it.
     Bigger than the row's other text and heavier than it, because a thread
     is found by its name: everything else here is metadata about a row the
     reader has already located. Two lines rather than one, clamped: a
     one-line ellipsis on a 260px column shows about three words, and three
     words is not enough to tell two afternoons of price research apart.
     The clamp needs all four of these declarations together — the box
     display, the vertical orientation, the line count, and `overflow` —
     and `white-space:normal` because the row's old rule was `nowrap`,
     under which a clamp can only ever have one line to count. */
  .threads .title{flex:1; min-width:0; display:-webkit-box; -webkit-box-orient:vertical;
    -webkit-line-clamp:2; overflow:hidden; white-space:normal; overflow-wrap:anywhere;
    background:transparent; border:0; font:inherit; font-size:14.5px; font-weight:500;
    line-height:1.35; color:var(--base1); text-align:left; padding:0; cursor:pointer}
  .threads li.current .title{font-weight:600; color:var(--base2)}
  /* A thread nobody has named yet says so in the muted, italic voice the
     page uses for absence, so it does not read as a thread called "New
     thread".
     Written with the `li` it does not need, to match the specificity of
     the current-row colour above: without it that rule is the more
     specific of the two and the current thread's placeholder would be
     drawn as though it had a name. */
  .threads li .title.unnamed{color:var(--base01); font-style:italic}
  /* Renaming happens in place: the input replaces the title button inside
     the row, so the row does not jump when it appears. Matched on the `li`
     rather than on `.title`, because the input is the button's replacement
     and not its child. */
  .threads li input{flex:1; min-width:0; font:inherit; background:var(--base03); color:var(--base2);
    border:1px solid var(--blue); border-radius:6px; padding:2px 6px}
  .threads .when{font-size:12px; color:var(--base0); flex:none}
  /* A thread about to age out is the one piece of the row meant to alarm,
     so it is the one that has to be legible: `--red` on `--base02` is
     2.8:1, which fails at 12px. A lighter red and a heavier weight carry
     the same warning and can actually be read. It also takes a line of its
     own under the row, so a warning long enough to be a sentence never
     competes with the title for the column's width. */
  .threads .when.expiring{color:#ff6e67; font-weight:600; flex:0 0 100%; order:1}
  .threads .pin{flex:none; display:flex; color:var(--blue)}
  /* Pointing at a row trades its ambient metadata for its controls, the
     way a mail list does: 28px targets and a title cannot both fit a
     240px column, and once you are acting on a row its name and its
     buttons are what you need. The pin mark goes for the same reason it
     can — the pin toggle in the tools, pressed, says the same thing in
     the same place. The expiry warning stays: it has its own line. */
  .threads li:hover .pin,.threads li.current .pin,.threads li:focus-within .pin,
  .threads li:hover .when:not(.expiring),.threads li.current .when:not(.expiring),
  .threads li:focus-within .when:not(.expiring){display:none}
  /* Controls show on hover, on the current row, and — the keyboard's turn —
     while focus is anywhere in the row. Touch has no hover, so the current
     row is the row a phone can act on; a keyboard has no hover either, and
     without `:focus-within` Tab would move focus onto a `display:none`
     button, which is to say nowhere. Every row but the current one would be
     unreachable without a mouse. */
  .threads .tools{display:none; gap:4px; flex:none}
  .threads li:hover .tools,.threads li.current .tools,.threads li:focus-within .tools{display:flex}
  /* On the current row the tools are on screen permanently, so they take
     a full-width line under the title instead of standing beside it —
     the title is then the whole width of the column on both its lines,
     and the four targets keep their full size. Ranged right, under the
     text rather than beside its start, so the eye reading the name is not
     crossing them. On any other row they appear only while it is pointed
     at or focused, next to a title the reader is already reading, and
     that is a moment, not a layout. */
  .threads li.current .tools{flex-basis:100%; justify-content:flex-end}
  /* 28px, not the 17px these were: on touch the current row's tools are
     the only way to act on a thread, and delete sits right beside
     auto-name — a pitch that small makes losing a thread a slip of the
     thumb. */
  .threads .tools button{background:transparent; border:0; color:var(--base01); cursor:pointer;
    min-width:28px; min-height:28px; padding:6px; font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center}
  /* Inline on a row that is merely hovered, where they share the line
     with the title: smaller, but never under 24px, which is the smallest
     target a finger can be asked for — and a hovered row is a pointer,
     which is more accurate than a finger anyway. */
  .threads li:not(.current) .tools button{min-width:24px; min-height:24px; padding:5px; font-size:12px}
  .threads .tools button:hover{color:var(--base1)}
  .threads .tools button[aria-pressed="true"]{color:var(--blue)}
  /* Every control the sidebar reaches by keyboard says so, inset so the
     ring is not clipped by the scrolling box it sits in. */
  .threads .title:focus-visible,.threads .tools button:focus-visible,.menu:focus-visible{
    outline:2px solid var(--blue); outline-offset:-2px}
  .menu{display:none; background:transparent; border:0; color:var(--base1); cursor:pointer; padding:8px}
  .trips-view{flex:1; min-height:0; display:grid; grid-template-columns:260px 1fr; gap:24px;
    padding:4px 0 20px}
  .trip-side{min-height:0; overflow-y:auto; padding:0 12px 16px 0; border-right:1px solid var(--line)}
  .trip-side-head{display:flex; align-items:end; justify-content:space-between; padding:6px 10px 13px}
  .eyebrow{margin:0 0 2px; color:var(--cyan); font-size:11px; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase}
  .trip-side h1{margin:0; color:var(--base2); font-size:20px; line-height:1.2}
  .trip-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
  .trip-list button{width:100%; border:0; border-radius:11px; padding:11px 12px;
    background:transparent; color:var(--base0); font:inherit; text-align:left; cursor:pointer}
  .trip-list button:hover{background:var(--base02)}
  .trip-list button[aria-current="true"]{background:var(--base02); color:var(--base2);
    box-shadow:inset 3px 0 var(--cyan)}
  .trip-list button:focus-visible{outline:2px solid var(--blue); outline-offset:-2px}
  .trip-list-name{display:block; color:inherit; font-size:14.5px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .trip-list-route{display:block; margin-top:2px; color:var(--base01); font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* Allowed to wrap, unlike the name and route above it: this is the one
     line on the row that has to stay true on its own, without the Keep
     button beside it on the trip's own page to finish the sentence. */
  .trip-list-draft{display:block; margin-top:3px; color:#d1c27e; font-size:11px; line-height:1.3}
  .trip-detail{min-height:0; overflow-y:auto; padding:0 8px 32px 0;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  .trip-empty{min-height:100%; display:grid; place-items:center; text-align:center; padding:44px 24px;
    border:1px dashed var(--line); border-radius:18px; color:var(--base01)}
  .trip-empty svg{color:var(--cyan); margin-bottom:14px}
  .trip-empty h2{margin:0 0 6px; color:var(--base2); font-size:21px}
  .trip-empty p{margin:0; max-width:440px}
  .trip-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    margin:0 0 18px; padding:2px 2px 0}
  .trip-title{margin:0; color:var(--base2); font-size:clamp(25px,3vw,34px); line-height:1.12;
    letter-spacing:-.025em}
  .trip-subtitle{margin:7px 0 0; color:var(--base0); font-size:14px}
  .trip-head-actions{display:flex; align-items:center; gap:8px; flex:none}
  .status-chip{display:inline-flex; align-items:center; gap:7px; flex:none; margin-top:5px;
    padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--base1);
    font-size:12px; font-weight:750; text-transform:capitalize}
  .status-chip::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--yellow)}
  .status-chip.finalised{color:#b8c76a; border-color:#596f2a}
  .status-chip.finalised::before{background:var(--green)}
  /* `.status-chip` capitalizes every word for the one-word statuses it was
     built for ("searching", "finalised"); this one is a sentence, and title
     case would make it read like a label rather than what it says. */
  .status-chip.draft{color:#d1c27e; border-color:#6c5b1d; text-transform:none}
  /* The control that makes the draft warning stop being true. Filled and
     blue like `.leg-add-row button` — the other place a press commits
     something to the trip, rather than the outlined, secondary look of
     `.trip-download`, which only ever reads what is already durable. */
  .trip-keep{display:inline-flex; align-items:center; margin-top:5px;
    padding:7px 14px; border:0; border-radius:8px; background:var(--blue);
    color:var(--base03); cursor:pointer; font-size:12px; font-weight:750; white-space:nowrap}
  .trip-keep:hover{background:#3196d8}
  .trip-keep:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .trip-keep:disabled{cursor:wait; opacity:.72}
  .trip-download{display:inline-flex; align-items:center; gap:7px; margin-top:5px;
    padding:7px 10px; border:1px solid var(--cyan); border-radius:8px; color:#6fc5bd;
    background:transparent; cursor:pointer; font-size:12px; font-weight:750;
    text-decoration:none; white-space:nowrap}
  .trip-download::before{content:"↓"; font-size:15px; line-height:1}
  .trip-download:hover{background:rgba(42,161,152,.1); color:var(--base2); text-decoration:none}
  .trip-download:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .trip-download:disabled{cursor:wait; opacity:.72}
  .trip-overview{margin-bottom:16px; padding:18px; border:1px solid var(--line); border-radius:16px;
    background:linear-gradient(135deg,rgba(7,54,66,.95),rgba(5,45,55,.7));
    box-shadow:0 10px 32px rgba(0,0,0,.16)}
  .trip-overview-label{display:flex; justify-content:space-between; gap:12px; margin-bottom:16px;
    color:var(--base01); font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em}
  .trip-timeline{display:flex; align-items:flex-start; overflow-x:auto; padding:2px 2px 8px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  .trip-point{min-width:92px; position:relative; text-align:center; flex:none}
  .trip-point::after{content:""; position:absolute; top:10px; left:calc(50% + 8px);
    width:calc(100% - 16px); height:2px; background:var(--line)}
  .trip-point:last-child::after{display:none}
  .trip-point.gap::after{background:repeating-linear-gradient(90deg,var(--yellow) 0 5px,transparent 5px 9px)}
  .point-dot{position:relative; z-index:1; width:20px; height:20px; margin:0 auto 8px;
    display:grid; place-items:center; border:2px solid var(--cyan); border-radius:50%;
    background:var(--base03); color:var(--cyan)}
  .point-dot::after{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
  .trip-point.gap .point-dot{border-color:var(--yellow); color:var(--yellow)}
  .point-code{display:block; color:var(--base2); font-size:14px; font-weight:800; letter-spacing:.05em}
  .point-date{display:block; margin-top:1px; color:var(--base01); font-size:11px}
  .trip-alert{display:block; margin:0 0 14px; padding:11px 13px;
    border:1px solid #6c5b1d; border-radius:12px; background:rgba(181,137,0,.09);
    color:#d1c27e; font-size:13px; line-height:1.45}
  .trip-alert.ready{border-color:#3f682f; background:rgba(133,153,0,.08); color:#b8c76a}
  .trip-alert strong{color:var(--base2); margin-right:.28em}
  .segment-stack{display:flex; flex-direction:column; gap:12px}
  /* Dashed, like `.trip-empty`: this card is an invitation to add to the
     itinerary, not part of it yet. Sits after the stack rather than inside
     it — appending is the only insert this form offers, so it belongs where
     an appended leg would actually land. */
  .leg-add{margin-top:12px; padding:14px 16px; border:1px dashed var(--line); border-radius:16px;
    background:rgba(7,54,66,.4)}
  .leg-add-title{margin:0 0 10px; color:var(--base01); font-size:11px; font-weight:800;
    letter-spacing:.1em; text-transform:uppercase}
  .leg-add-row{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px}
  .leg-add-row label{display:flex; flex-direction:column; gap:4px; flex:1; min-width:100px;
    color:var(--base01); font-size:12px}
  .leg-add-row input{font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line);
    border-radius:9px; background:var(--base03); color:var(--base2)}
  /* The wire format is uppercase IATA; showing it uppercase as it is typed
     means what gets submitted is what the reader already saw. */
  .leg-add-row input.leg-add-code{text-transform:uppercase}
  .leg-add-row input:focus{outline:2px solid var(--blue); outline-offset:-1px}
  .leg-add-row button{flex:none; background:var(--blue); color:var(--base03); border:0;
    border-radius:9px; font:inherit; font-size:13px; font-weight:700; padding:9px 16px; cursor:pointer}
  .leg-add-row button:hover{background:#3196d8}
  .leg-add-row button:disabled{opacity:.6; cursor:default}
  .segment-card{border:1px solid var(--line); border-radius:16px; background:rgba(7,54,66,.62);
    overflow:hidden}
  .segment-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:15px 16px 13px; border-bottom:1px solid rgba(13,74,90,.75)}
  .segment-kicker{margin:0 0 4px; color:var(--base01); font-size:11px; font-weight:800;
    letter-spacing:.1em; text-transform:uppercase}
  .segment-route{margin:0; color:var(--base2); font-size:22px; line-height:1.15}
  .route-arrow{padding:0 7px; color:var(--cyan); font-weight:400}
  .segment-date{flex:none; margin-top:2px; color:var(--base1); font-size:13px}
  .segment-head-actions{flex:none; display:flex; align-items:center; gap:10px}
  .segment-remove-button{background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--base01); font:inherit; font-size:12px; font-weight:650; padding:6px 10px; cursor:pointer}
  .segment-remove-button:hover{color:#ff817a; border-color:var(--red)}
  .segment-remove-button:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
  /* The second click of the confirm-in-place flow described where
     `removeConfirmRow` is built: `window.confirm` blocks the whole page for
     one card's worth of destructive action, so the ask lives here instead,
     inline where the button it replaced was. */
  .segment-remove-confirm{display:flex; align-items:center; gap:6px; color:#d1c27e; font-size:12px}
  .segment-remove-confirm button{background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--base1); font:inherit; font-size:12px; font-weight:650; padding:5px 9px; cursor:pointer}
  .segment-remove-confirm button:hover{color:var(--base2)}
  /* `#ff817a`, not `--red`: the same lighter shade `.join-card.danger` and
     `.threads .when.expiring` already use, because `--red` on this
     background is 2.8:1 and fails at this text size. */
  .segment-remove-confirm button.danger{border-color:var(--red); color:#ff817a}
  .segment-remove-confirm button:disabled{opacity:.6; cursor:default}
  .option-list{display:flex; flex-direction:column}
  .flight-option{position:relative; display:grid; grid-template-columns:28px minmax(0,1fr) auto;
    gap:12px; align-items:start; padding:15px 16px; cursor:pointer; border-bottom:1px solid rgba(13,74,90,.55)}
  .flight-option:last-child{border-bottom:0}
  .flight-option:hover{background:rgba(18,70,89,.5)}
  .flight-option.selected{background:rgba(42,161,152,.08); box-shadow:inset 3px 0 var(--cyan)}
  .flight-option.saving{opacity:.58; pointer-events:none}
  .flight-option input{position:absolute; opacity:0; pointer-events:none}
  .option-radio{width:20px; height:20px; margin-top:2px; border:2px solid var(--base01);
    border-radius:50%; display:grid; place-items:center}
  .flight-option input:focus-visible + .option-radio{outline:2px solid var(--blue); outline-offset:3px}
  .flight-option:focus-within{outline:2px solid var(--blue); outline-offset:-2px}
  .selected .option-radio{border-color:var(--cyan)}
  .selected .option-radio::after{content:""; width:10px; height:10px; border-radius:50%;
    background:var(--cyan)}
  .option-main{min-width:0}
  .option-top{display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-bottom:8px}
  .airline{color:var(--base2); font-size:14px; font-weight:750}
  .flight-number{padding:2px 6px; border-radius:5px; background:var(--base03);
    color:var(--base0); font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
  .source-label{color:var(--base01); font-size:11px; text-transform:capitalize}
  .flight-line{display:flex; align-items:stretch; min-width:0}
  .flight-time{width:58px; flex:none}
  .flight-time strong{display:block; color:var(--base2); font-size:17px; line-height:1.15}
  .flight-time span{display:block; margin-top:2px; color:var(--base01); font-size:11px}
  .flight-track{flex:1; min-width:68px; padding:4px 10px 0; text-align:center}
  .track-rule{position:relative; display:block; height:2px; margin:6px 0 7px; background:var(--line)}
  .track-rule::before,.track-rule::after{content:""; position:absolute; top:-3px; width:8px;
    height:8px; border-radius:50%; background:var(--cyan)}
  .track-rule::before{left:0}.track-rule::after{right:0}
  .flight-meta{display:flex; justify-content:center; gap:7px; flex-wrap:wrap;
    color:var(--base01); font-size:11px; line-height:1.35}
  .stop-pill{color:#d1c27e}
  .stop-pill.direct{color:#b8c76a}
  .option-price{min-width:76px; text-align:right}
  .option-price strong{display:block; color:var(--base2); font-size:17px; line-height:1.2}
  .option-price span{display:block; margin-top:4px; color:var(--base01); font-size:10px;
    text-transform:uppercase; letter-spacing:.06em}
  .no-options{margin:0; padding:18px 16px; color:var(--base01); font-size:13px}
  .join-card{display:flex; align-items:center; gap:11px; margin:0 16px; padding:10px 13px;
    border-left:2px solid var(--green); color:var(--base0); font-size:12.5px}
  .join-card::before{content:""; width:8px; height:8px; flex:none; border-radius:50%; background:var(--green)}
  .join-card.warning{border-color:var(--yellow); color:#d1c27e}
  .join-card.warning::before{background:var(--yellow)}
  .join-card.danger{border-color:var(--red); color:#ff817a}
  .join-card.danger::before{background:var(--red)}
  .trip-toast{position:sticky; bottom:8px; z-index:4; width:max-content; max-width:calc(100% - 16px);
    margin:12px auto 0; padding:9px 13px; border:1px solid var(--line); border-radius:10px;
    background:#001f27; color:var(--base1); box-shadow:0 8px 24px rgba(0,0,0,.35); font-size:13px}
  /* Below the two-column threshold the sidebar becomes a drawer: it stacks
     above the transcript rather than beside it, is out of the way until the
     menu button opens it, and is capped so it can never take the screen the
     conversation is on. */
  @media (max-width:720px){
    header{padding-top:14px; gap:8px}
    .mark .word{display:none}
    .view-tabs{margin-right:auto}
    .mark{margin-right:0}
    .columns{display:flex; flex-direction:column; gap:0}
    .side{display:none; border-right:0; border-bottom:1px solid #0d4a5a; max-height:40dvh; padding:0 0 8px}
    .side.open{display:block}
    .menu{display:block}
    .trips-view{display:flex; flex-direction:column; gap:12px; overflow:hidden}
    .trip-side{min-height:auto; overflow:visible; padding:0; border-right:0}
    .trip-side-head{padding:0 2px 10px}
    .trip-side h1{font-size:17px}
    .trip-list{flex-direction:row; overflow-x:auto; padding:0 0 7px; scrollbar-width:thin}
    .trip-list li{flex:0 0 164px}
    .trip-list button{background:rgba(7,54,66,.5)}
    .trip-detail{padding-right:0}
    .trip-overview{padding:15px 12px}
    .trip-point{min-width:64px; flex:1}
    .trip-head{margin-bottom:14px}
    .trip-head-actions{align-items:flex-end; flex-direction:column-reverse; gap:3px}
    .trip-title{font-size:26px}
    .flight-option{grid-template-columns:24px minmax(0,1fr); gap:9px 8px; padding:14px 12px}
    .option-price{grid-column:2; min-width:0; text-align:left; display:flex; align-items:baseline; gap:5px}
    .option-price span{display:inline}
    .flight-track{padding-left:5px; padding-right:5px}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <button id="menu" type="button" class="menu" aria-label="Threads"
          aria-controls="side" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>
  <a class="mark" href="/">
    <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
      <g fill="none" stroke="currentColor">
        <circle cx="23.5" cy="36" r="11.5" stroke-width="3.2"/>
        <circle cx="48.5" cy="36" r="11.5" stroke-width="3.2"/>
        <circle cx="23.5" cy="36" r="4" stroke-width="2.6"/>
        <circle cx="48.5" cy="36" r="4" stroke-width="2.6"/>
      </g>
      <rect x="34" y="33.4" width="4" height="5.2" fill="currentColor"/>
    </svg>
    <span class="word">Scout</span>
  </a>
  <nav class="view-tabs" aria-label="Workspace">
    <button id="view-chat" type="button" aria-pressed="true"
            aria-controls="chat-workspace">Chat</button>
    <button id="view-trips" type="button" aria-pressed="false"
            aria-controls="trips-view">Trips<span id="trip-count" class="tab-count" hidden></span></button>
  </nav>
  <div class="controls">
    <button id="mirror" type="button" aria-pressed="<!--MIRROR-->"
            title="Also send this thread to Telegram">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M21.7 3.4 2.9 10.6c-.9.3-.9 1.5.05 1.8l4.7 1.5 1.8 5.3c.3.8 1.3 1 1.9.4l2.6-2.5 4.6 3.4c.6.4 1.5.1 1.7-.7l3.2-15c.2-.9-.7-1.6-1.75-1.4z"/>
      </svg>
    </button>
  </div>
</header>
<div id="chat-workspace" class="columns">
  <aside id="side" class="side">
    <form id="reset" class="reset">
      <button type="submit">New thread</button>
    </form>
    <ol id="threads" class="threads"></ol>
  </aside>
  <main class="main">
    <ol id="turns" class="turns"></ol>
  </main>
</div>
<section id="trips-view" class="trips-view" aria-labelledby="view-trips" hidden>
  <aside class="trip-side" aria-label="Saved trips">
    <div class="trip-side-head">
      <div>
        <p class="eyebrow">Itineraries</p>
        <h1>Your trips</h1>
      </div>
    </div>
    <ol id="trip-list" class="trip-list"></ol>
  </aside>
  <main id="trip-detail" class="trip-detail" aria-live="polite">
    <div class="trip-empty">
      <div>
        <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
          <path d="M10 43h44M16 37l11-20 7 3-3 14 14-9 5 4-18 13z" fill="none"
                stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>Loading your trips</h2>
        <p>Scout is gathering the routes and flight options you saved in chat.</p>
      </div>
    </div>
  </main>
</section>
<!-- Shared by both tabs, pinned below whichever is showing: a trip picked
     on the Trips tab is answered in the same box that asks a question in
     Chat, not a second composer duplicated per view. -->
<p id="status" class="status" hidden></p>
<p id="notice" class="notice" hidden></p>
<p id="compose-target" class="compose-target" hidden></p>
<form id="ask" class="ask">
  <textarea id="text" name="text" rows="1"
            placeholder="Ask Scout something" required></textarea>
  <button id="send" type="submit" aria-label="Send">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>
</div>
<script type="module" src="/chat.js"></script>
</body>
</html>
