services:
  scout:
    build: .
    env_file: .env
    environment:
      SCOUT_DB_PATH: /data/scout.duckdb
    volumes:
      - scout-data:/data
    # Chromium's helper processes (renderer, zygote, crashpad) outlive the
    # process we spawn and are reparented to PID 1. Without an init there,
    # scout is PID 1 and never reaps them: one render left 35 zombies, which
    # ends in an exhausted PID table.
    init: true
    restart: unless-stopped
    # How long Docker waits after SIGTERM before SIGKILL. One request is
    # bounded by RUN_BUDGET (300s) plus link verification and wrap-up, so
    # this has to exceed that or a deploy still kills the slowest answers.
    # Reached only when something is actually running; an idle bot exits at
    # once. See the SIGTERM handler in bot::run.
    stop_grace_period: 330s

volumes:
  scout-data:
